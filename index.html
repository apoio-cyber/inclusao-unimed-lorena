<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ficha de Inclusão Cucinare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: formulário em etapas, coluna única de 720px, barra de etapas no topo e navegação fixa no rodapé */
:root{
  --paper:#f6f7f4; --card:#ffffff; --ink:#18202b; --muted:#5b6573; --line:#d9ddd6;
  --pen:#1d3f94; --pen-soft:#e7ecf8; --sim:#b4321f; --sim-soft:#fbe9e5; --ok:#2f7a4b; --ok-soft:#e5f2ea;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161c; --card:#1a2028; --ink:#e7eaee; --muted:#9aa4b1; --line:#2c3440;
  --pen:#8fb0ff; --pen-soft:#1f2b45; --sim:#ff8c75; --sim-soft:#3a201b; --ok:#7fd3a0; --ok-soft:#18301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161c; --card:#1a2028; --ink:#e7eaee; --muted:#9aa4b1; --line:#2c3440;
  --pen:#8fb0ff; --pen-soft:#1f2b45; --sim:#ff8c75; --sim-soft:#3a201b; --ok:#7fd3a0; --ok-soft:#18301f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;line-height:1.15}
h2{font-size:1.25rem}
h3{font-size:1rem;font-family:var(--body);font-weight:700;letter-spacing:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.lead{color:var(--muted);margin:.4rem 0 0;max-width:60ch}
header.top{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:6px;padding-block:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.steps button{flex:1;min-width:0;border:0;background:none;font:600 .78rem var(--body);color:var(--muted);padding:6px 4px;border-bottom:3px solid var(--line);cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button[aria-current="step"]{color:var(--pen);border-color:var(--pen)}
.steps button.done{color:var(--ok);border-color:var(--ok)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 6;min-width:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
@media (max-width:560px){.s2,.s3,.s4{grid-column:span 6}.s2.half,.s3.half{grid-column:span 3}}
label{font-size:.8rem;font-weight:600;color:var(--ink)}
label .req{color:var(--sim)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
.bad{border-color:var(--sim)!important;background:var(--sim-soft)}
.hint{font-size:.75rem;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{font:600 .92rem var(--body);border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--card)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
.errs{border:1px solid var(--sim);background:var(--sim-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.88rem}
.errs ul{margin:.3rem 0 0;padding-left:1.1rem}
.dephead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--pen);background:var(--pen-soft);border-radius:4px;padding:2px 7px}
/* questionário */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--muted)}
.qgroup{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.qgroup>h3{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.qgroup>h3 .n{font-family:var(--mono);color:var(--pen);font-size:.85rem;min-width:1.6em}
.q{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.q:last-child{border-bottom:0}
.q .lbl{display:flex;gap:10px;font-size:.92rem}
.q .lbl .sub{font-family:var(--mono);color:var(--muted);min-width:1.6em;font-size:.82rem;padding-top:1px}
.answers{display:flex;flex-wrap:wrap;gap:6px;padding-left:2.2em}
.ans{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 6px 4px 11px;font:500 .8rem var(--body);cursor:pointer}
.ans b{font-family:var(--mono);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:.8rem}
.ans[aria-pressed="true"]{border-color:var(--sim);background:var(--sim-soft)}
.ans[aria-pressed="true"] b{background:var(--sim);color:var(--card);border-color:var(--sim)}
.spec{margin-left:2.2em;border-left:3px solid var(--sim);padding:8px 0 8px 12px;display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px}
@media (max-width:560px){.spec{grid-template-columns:minmax(0,1fr)}.answers,.spec{padding-left:0;margin-left:0}}
.spec .who{grid-column:1/-1;font-size:.78rem;font-weight:700;color:var(--sim);text-transform:uppercase;letter-spacing:.05em}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:auto;margin-top:4px}
/* revisão */
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-size:.9rem}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-weight:600}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.file span{min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.steps-list{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}
.note{font-size:.82rem;color:var(--muted)}
.okbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:8px;padding:10px 14px;font-size:.88rem}
.docsbox{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.docsbox summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--pen)}
.docsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 16px 16px}
@media (max-width:560px){.docsgrid{grid-template-columns:minmax(0,1fr)}}
.docs{display:flex;flex-direction:column;gap:6px}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks li::before{content:"";flex:none;width:13px;height:13px;margin-top:4px;border:1.5px solid var(--pen);border-radius:3px}
.trocar{margin-left:8px;border:0;background:none;color:var(--pen);font:600 .72rem var(--body);text-transform:none;letter-spacing:0;text-decoration:underline;cursor:pointer;padding:0}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.choose{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 18px;cursor:pointer;color:var(--ink);font:inherit}
.opt:hover{border-color:var(--pen)}
.opt h2{font-size:1.35rem}
.opt .who{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--pen)}
.opt p{margin:0;color:var(--muted);font-size:.9rem}
.radios{display:flex;flex-direction:column;gap:6px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--paper);cursor:pointer;font-size:.9rem}
.radio input{width:auto;margin-top:3px;flex:none}
.radio:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}
.radios.bad .radio{border-color:var(--sim)}
.calc{font-size:.88rem;background:var(--pen-soft);border-radius:8px;padding:8px 12px}
.doclist{display:flex;flex-direction:column;gap:8px}
.docrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.docrow.off{opacity:.6}
.docrow .t{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.docrow .t small{color:var(--muted);font-size:.78rem}
.pill{font:700 .68rem var(--body);text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:3px 8px;white-space:nowrap}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--line);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ans,.btn{transition:background .12s,border-color .12s}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">Cucinare Pro Alimentação · Plano Unimed Lorena <button type="button" class="trocar" id="trocar" hidden>Trocar inclusão / exclusão</button></span>
    <h1 id="titulo">Formulários do plano de saúde</h1>
    <p class="lead" id="lead">Escolha o que você precisa fazer. No final você baixa os formulários prontos para imprimir e assinar. Nada do que você digita fica salvo neste site.</p>
  </header>

  <nav class="steps" id="steps" aria-label="Etapas"></nav>

  <div id="errs" class="errs" hidden></div>
  <main id="view"></main>
</div>

<div class="navbar" id="navbar"><div class="in">
  <button type="button" class="btn ghost" id="voltar">Voltar</button>
  <span class="note" id="pos"></span>
  <button type="button" class="btn primary" id="avancar">Continuar</button>
</div></div>

    f: 'Outros',
  };
  const TEM_DIREITO = ['b', 'd', 'e']; // arts. 30 e 31 da Lei 9.656/98

  function nomeProprio(s) {
    return (s || '').trim().replace(/\s+/g, ' ').toLowerCase().split(' ')
      .map((w, i) => (i > 0 && MINUSC.includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }
  const dig = s => (s || '').replace(/\D/g, '');

  function fmtValor(v) {

    return isFinite(n) ? 'R$ ' + n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
  }
  // período entre duas datas ISO em anos, meses e dias
  function periodo(ini, fim) {
    const a = partes(ini), b = partes(fim);

    let y = +b.a - +a.a, m = +b.m - +a.m, d = +b.d - +a.d;

const MASK={
  cpf:v=>{v=v.replace(/\D/g,'').slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4')},
  cep:v=>{v=v.replace(/\D/g,'').slice(0,8);return v.replace(/(\d{5})(\d)/,'$1-$2')},
  tel:v=>{v=v.replace(/\D/g,'').slice(0,11);if(v.length>10)return v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');return v.replace(/(\d{2})(\d{0,4})(\d{0,4})/,(m,a,b,c)=>`(${a}) ${b}${c?'-'+c:''}`)},
  cns:v=>{v=v.replace(/\D/g,'').slice(0,15);return v.replace(/(\d{3})(\d{0,4})(\d{0,4})(\d{0,4})/,(m,a,b,c,d)=>[a,b,c,d].filter(Boolean).join(' '))},
  mesano:v=>{v=v.replace(/\D/g,'').slice(0,6);return v.length>2?v.slice(0,2)+'/'+v.slice(2):v},
  altura:v=>{v=v.replace(/[^\d,.]/g,'').replace('.',',');const d=v.replace(/\D/g,'');if(/^\d{3}$/.test(d)&&!v.includes(','))return d[0]+','+d.slice(1);return v.slice(0,4)},
  peso:v=>v.replace(/\D/g,'').slice(0,3),
  valor:v=>v.replace(/[^\d,.]/g,'').slice(0,12),
  cart:v=>{const d=v.replace(/\D/g,'').slice(0,17);const p=[d.slice(0,4),d.slice(4,8),d.slice(8,14),d.slice(14,16),d.slice(16,17)];let o=p[0];if(d.length>4)o+='.'+p[1];if(d.length>8)o+='.'+p[2];if(d.length>14)o+='-'+p[3];if(d.length>16)o+='-'+p[4];return o}
};

/* ---------- validação ---------- */
function cpfOk(c){c=(c||'').replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;
  for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if(((s*10)%11)%10!==+c[t])return false}return true}
function validar(step){
  const e=[], bad=[];
  const req=(o,path,k,nome)=>{ if(!String(o[k]??'').trim()){e.push(nome);bad.push(`${path}.${k}`)} };
  const pessoa=(o,path,quem,tit)=>{
    req(o,path,'nome',`${quem}: nome`);
    if(!cpfOk(o.cpf)){e.push(`${quem}: CPF inválido`);bad.push(`${path}.cpf`)}
    req(o,path,'rg',`${quem}: RG`);
    if((o.cns||'').replace(/\D/g,'').length!==15){e.push(`${quem}: Cartão Nacional de Saúde precisa ter 15 números`);bad.push(`${path}.cns`)}
    req(o,path,'nascimento',`${quem}: data de nascimento`);
    req(o,path,'sexo',`${quem}: sexo`);req(o,path,'estadoCivil',`${quem}: estado civil`);
    req(o,path,'nomeMae',`${quem}: nome da mãe`);req(o,path,'nacionalidade',`${quem}: nacionalidade`);
    if(!tit && !PARENT.includes(o.parentesco)){e.push(`${quem}: parentesco`);bad.push(`${path}.parentesco`)}
    const p=+o.peso; if(!(p>=1&&p<=300)){e.push(`${quem}: peso em kg`);bad.push(`${path}.peso`)}
    const a=parseFloat(String(o.altura).replace(',','.')); if(!(a>=0.3&&a<=2.3)){e.push(`${quem}: altura no formato 1,72`);bad.push(`${path}.altura`)}
  };
  if(step===0){
    const t=S.titular; pessoa(t,'t','Você',true);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((t.email||'').trim())){e.push('E-mail válido');bad.push('t.email')}
    const tl=(t.telefone||'').replace(/\D/g,''); if(tl.length<10){e.push('Telefone com DDD');bad.push('t.telefone')}
    if((t.cep||'').replace(/\D/g,'').length!==8){e.push('CEP com 8 números');bad.push('t.cep')}
    for(const [k,n] of [['endereco','Endereço'],['numero','Número'],['bairro','Bairro'],['cidade','Cidade'],['admissao','Data de admissão'],['profissao','Profissão']]) req(t,'t',k,n);
  }
  if(step===1) S.deps.forEach((d,i)=>pessoa(d,'d'+i,`Dependente ${i+1}`,false));
  if(step===2){
    for(const q of D.perguntas) S.resp[q.id].forEach((r,i)=>{ if(r==='S'){const k=`${q.id}|${i}`,x=S.esp[k]||{};
      if(!(x.texto||'').trim()){e.push(`Item ${q.item}${q.sub} (${pnome(i)}): informe o diagnóstico`);bad.push('e-'+k)}
      if(!/^(0[1-9]|1[0-2])\/(19|20)\d\d$/.test(x.periodo||'')){e.push(`Item ${q.item}${q.sub} (${pnome(i)}): mês/ano do diagnóstico, ex. 03/2017`);bad.push('p-'+k)} }});
    if(!S.leu){e.push('Confirme que leu todas as perguntas');bad.push('leu')}
  }
  return {e,bad};
}
function mostraErros(r){
  const box=$('#errs');
  document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
  if(!r.e.length){box.hidden=true;return true}
  box.innerHTML=`<b>Falta corrigir antes de continuar:</b><ul>${r.e.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${r.e.length>12?`<span>e mais ${r.e.length-12}.</span>`:''}`;
  box.hidden=false;
  r.bad.forEach(id=>{const el=document.getElementById(id); if(el) el.classList.add('bad')});
  window.scrollTo({top:0,behavior:'smooth'});
  return false;
}

/* ---------- CEP automático (ViaCEP) ---------- */
let cepUltimo='';
async function buscaCEP(cep){
  const msg=document.getElementById('cepmsg');
  if(cep===cepUltimo) return; cepUltimo=cep;
  if(msg) msg.textContent='Buscando endereço…';
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    if(!r.ok) throw 0;
    const j=await r.json();
    if(j.erro){ if(msg) msg.textContent='CEP não encontrado. Confira o número ou preencha o endereço à mão.'; return; }
    const t=S.titular;
    const set=(k,v)=>{ if(!v) return; t[k]=v; const el=document.getElementById('t.'+k); if(el){el.value=v; el.classList.remove('bad')} };
    set('endereco',j.logradouro); set('bairro',j.bairro); set('cidade',j.localidade?`${j.localidade}/${j.uf}`:'');
    if(!t.complemento && j.complemento) set('complemento',j.complemento);
    salvar(); cache=null;
    if(msg) msg.textContent=j.logradouro?'Endereço preenchido. Agora informe o número.':'Cidade preenchida. Este CEP é geral: digite a rua e o bairro.';
    const alvo=document.getElementById(j.logradouro?'t.numero':'t.endereco'); if(alvo&&!alvo.value) alvo.focus();
  }catch(e){ cepUltimo=''; if(msg) msg.textContent='Não consegui buscar o CEP agora. Preencha o endereço à mão.'; }
}
document.addEventListener('input',e=>{ if(e.target.id==='t.cep'){ const d=e.target.value.replace(/\D/g,''); if(d.length===8) buscaCEP(d); else cepUltimo=''; } });

/* ---------- geração ---------- */
let cache=null, arqs=null;
async function carregaArquivos(){
  if(arqs) return arqs;
  const get=async n=>{const r=await fetch(n); if(!r.ok) throw new Error('Não consegui carregar '+n); return new Uint8Array(await r.arrayBuffer())};
  const [saude,glc,mov,assinatura,carimbo]=await Promise.all(['declaracao_saude.pdf','declaracao_glc.pdf','movimentacao.pdf','assinatura_intermediario.png','carimbo_empresa.png'].map(get));
  return arqs={saude,glc,mov,assinatura,carimbo,dados:D};
}
async function gerar(){
  if(cache) return cache;
  const a=await carregaArquivos();
  const esp=Object.entries(S.esp).map(([k,v])=>({q:k.split('|')[0],prop:+k.split('|')[1],texto:v.texto,periodo:v.periodo}));
  const r=await M.gerarTodos({data:S.data,titular:S.titular,dependentes:S.deps,respostas:S.resp,especificacoes:esp},a,PDFLib);
  if(r.sobra.length) throw new Error('As especificações não cabem no quadro da declaração. Encurte os textos das respostas S e tente de novo.');
  const tudo=await PDFLib.PDFDocument.create();
  for(const b of [r.saude,r.glc,r.mov]){const d=await PDFLib.PDFDocument.load(b); (await tudo.copyPages(d,d.getPageIndices())).forEach(p=>tudo.addPage(p))}
  r.tudo=await tudo.save();
  return cache=r;
}
const NOMES={tudo:'Inclusao Unimed',saude:'Declaracao de Saude',glc:'Declaracao MPS GLC',mov:'Movimentacao Cadastral'};
async function baixar(tipo,btn){
  const msg=$('#dlmsg'); btn.disabled=true; msg.textContent='Preparando o PDF…';
  try{
    const r=await gerar();
    const nome=`${NOMES[tipo]} - ${M.nomeProprio(S.titular.nome)}.pdf`;
    const url=URL.createObjectURL(new Blob([r[tipo]],{type:'application/pdf'}));
    const a=document.createElement('a'); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    msg.textContent=`Baixado: ${nome}`;
  }catch(err){
    msg.textContent=(err&&err.message)||'Não foi possível gerar o arquivo.';
  }finally{btn.disabled=false}
}
// limpa cache se dados mudarem
document.addEventListener('input',()=>{cache=null},true);
document.addEventListener('click',e=>{if(e.target.closest('.ans,[data-rm],#adddep'))cache=null},true);

/* ================= EXCLUSÃO (preenchido pelo RH) ================= */
const MX = MotorExclusao;
function radios(name, opts, atual) {
  return `<div class="radios" id="r-${name}">${opts.map(([v, t]) => `<label class="radio"><input type="radio" name="${name}" data-xr="${name}" value="${v}"${atual === v ? ' checked' : ''}><span>${t}</span></label>`).join('')}</div>`;
}
function xDireito() { return MX.TEM_DIREITO.includes(X.motivo) && X.contribuiu === 'sim'; }
function xPeriodoTxt() {
  const p = MX.periodo(X.admissao, X.dataDemissao);
  if (!p) return '';
  const pl = (n, s, pl) => `${n} ${n === 1 ? s : pl}`;
  return `${pl(p.anos, 'ano', 'anos')}, ${pl(p.meses, 'mês', 'meses')} e ${pl(p.dias, 'dia', 'dias')}`;
}
function vxTitular() {
  const t = X.titular;
  let h = `<section class="card"><h2>Ex-empregado (titular)</h2><div class="grid">
    ${campo(t, 'xt', 'nome', 'Nome completo, sem abreviar', { cls: 's6' })}
    ${campo(t, 'xt', 'cpf', 'CPF', { cls: 's2', im: 'numeric', mask: 'cpf', ph: '000.000.000-00' })}
    ${campo(t, 'xt', 'codigo', 'Código do beneficiário', { cls: 's2', im: 'numeric', mask: 'cart', ph: '0090.2195.000002-00-0', hint: 'Número da carteirinha Unimed (17 números)' })}
    ${campo(t, 'xt', 'valor', 'Valor da mensalidade (R$)', { cls: 's2', im: 'decimal', mask: 'valor', ph: '0,00' })}
    ${campo(X, 'x', 'dataDemissao', 'Data da demissão', { cls: 's3', type: 'date' })}

  h += `<section class="card"><h2>Motivo da exclusão <span class="req">*</span></h2>
    ${radios('motivo', Object.entries(MX.MOTIVOS), X.motivo)}

  </section>`;
  h += `<section class="card"><h2>O funcionário contribuía para o plano? <span class="req">*</span></h2>
    <p class="note" style="margin:0">Contribuição é qualquer valor pago pelo funcionário para o plano dele, inclusive desconto em folha. Valores pagos só por dependentes ou coparticipação não contam.</p>
    ${radios('contribuiu', [['sim', 'Sim, contribuía'], ['nao', 'Não contribuía']], X.contribuiu)}
    ${X.contribuiu === 'sim' ? `<div class="grid">${campo(X, 'x', 'admissao', 'Data de admissão', { cls: 's3', type: 'date' })}</div>
      ${xPeriodoTxt() ? `<div class="calc">Período de contribuição (admissão até demissão): <b>${xPeriodoTxt()}</b></div>` : ''}` : ''}
  </section>`;
  h += `<section class="card"><h2>O ex-empregado optou por manter o plano? <span class="req">*</span></h2>
      <p class="note" style="margin:0">${xDireito() ? 'Pelos arts. 30 e 31 da Lei 9.656/98, ele pode continuar no plano pagando a mensalidade integral. Tem até 30 dias para decidir.' : 'Pela Lei 9.656/98, o direito de manter o plano vale para demissão sem justa causa ou aposentadoria, quando o funcionário contribuía.'}</p>
      ${radios('opcao', [['manter', 'Sim, optou por manter'], ['recusou', 'Não, recusou manter']], X.opcao)}
    </section>`;
  return h;
}
function vxDeps() {
  let h = `<section class="card"><h2>Dependentes a excluir</h2><p class="lead" style="margin:0">Inclua os dependentes que saem do plano junto com o titular (até 4). Se não houver, é só continuar.</p></section>`;
  X.deps.forEach((d, i) => {
    h += `<section class="card"><div class="dephead"><span class="tag">Dependente ${i + 1}</span><button type="button" class="btn ghost" data-xrm="${i}">Remover</button></div><div class="grid">
      ${campo(d, 'xd' + i, 'nome', 'Nome completo', { cls: 's6' })}
      ${campo(d, 'xd' + i, 'cpf', 'CPF', { cls: 's2', im: 'numeric', mask: 'cpf', req: false, ph: '000.000.000-00' })}
      ${campo(d, 'xd' + i, 'codigo', 'Código do beneficiário', { cls: 's2', im: 'numeric', mask: 'cart', ph: '0090.2195.000003-00-6', hint: 'Carteirinha (17 números)' })}
      ${campo(d, 'xd' + i, 'parentesco', 'Parentesco', { cls: 's2', opts: PARENT })}
      ${campo(d, 'xd' + i, 'valor', 'Valor da mensalidade (R$)', { cls: 's2', im: 'decimal', mask: 'valor', ph: '0,00' })}
    </div></section>`;
  });
  if (X.deps.length < 4) h += `<button type="button" class="btn" id="xadddep">+ Adicionar dependente</button>`;
  return h;
}
const XDOCS = [
  ['solicitacao', '1. Solicitação de exclusão do titular', 'Assinatura e carimbo da empresa (já sai carimbado)'],
  ['comunicadoEmpresa', '2. Comunicado da empresa ao ex-empregado', 'Assinatura do ex-empregado'],
  ['opcaoManutencao', '3. Declaração de opção de manutenção', 'Assinatura do ex-empregado'],
  ['movimentacao', '4. Movimentação Cadastral (exclusão)', 'Assinatura do titular (empresa já sai carimbada)'],
  ['extincao', '5. Comunicado de extinção do vínculo (portabilidade)', 'Ex-empregado assina o protocolo de recebimento'],
];
function xDocsMotivo(k, docs) {
  if (docs[k]) return '';
  if (k === 'comunicadoEmpresa') return 'Só para demissão sem justa causa ou aposentadoria, quando o funcionário contribuía';
  if (k === 'opcaoManutencao') return 'Só quando o ex-empregado opta por manter o plano';
  return '';
}
function vxGerar() {
  const docs = MX.documentos({ motivo: X.motivo, contribuiu: X.contribuiu === 'sim', opcao: X.opcao });
  const lista = XDOCS.map(([k, n, ass]) => `<div class="docrow${docs[k] ? '' : ' off'}"><div class="t"><b>${n}</b><small>${docs[k] ? ass : xDocsMotivo(k, docs)}</small></div>
    ${docs[k] ? `<button type="button" class="btn" data-xdl="${k}">Baixar</button>` : '<span class="pill no">Não se aplica</span>'}</div>`).join('');
  return `<section class="card"><h2>Conferência</h2><dl class="sum">
    <dt>Ex-empregado</dt><dd>${esc(MX.nomeProprio(X.titular.nome))}</dd>
    <dt>Motivo</dt><dd>${esc(MX.MOTIVOS[X.motivo] || '')}</dd>
    <dt>Data da demissão</dt><dd class="num">${M.fmtData(X.dataDemissao)}</dd>
    <dt>Data da exclusão</dt><dd class="num">${M.fmtData(X.data)}</dd>
    <dt>Dependentes excluídos</dt><dd class="num">${X.deps.length}</dd>
    <dt>Data dos formulários</dt><dd class="num">${M.fmtData(X.data)}</dd>
  </dl></section>
  <section class="card"><h2>Baixar os formulários</h2>
    <div class="file"><span><b>Todos os formulários</b> · um PDF só, na ordem certa</span><button type="button" class="btn primary" data-xdl="tudo">Baixar</button></div>
    <div class="doclist">${lista}</div>
    <div id="dlmsg" class="note" role="status"></div>
  </section>
  <section class="card"><h2>Próximos passos</h2><ol class="steps-list">
    <li>Imprima os formulários e colha as assinaturas indicadas em cada um.</li>
    ${docs.comunicadoEmpresa ? '<li>Entregue o <b>Comunicado da empresa</b> no ato da rescisão. O ex-empregado tem <b>30 dias</b> para decidir se mantém o plano.</li>' : ''}
    ${docs.direito ? '<li>Se ele optar por manter, deve ir à sede da Unimed de Lorena nesse prazo com comprovante de endereço, comprovante da contribuição (holerite com o desconto) e cópia da CTPS com início e fim do contrato.</li>' : ''}
    <li>Entregue o <b>Comunicado de extinção do vínculo</b> e peça para ele assinar o protocolo. A portabilidade de carências pode ser pedida em até <b>60 dias</b>.</li>
    <li>Envie à Unimed a Solicitação de exclusão e a Movimentação Cadastral assinadas.</li>
  </ol>
  <button type="button" class="btn ghost" id="limpar">Apagar os dados desta tela</button></section>`;
}
const XVIEWS = [vxTitular, vxDeps, vxGerar];
function renderX() {
  $('#titulo').textContent = 'Exclusão do plano de saúde';
  $('#lead').textContent = 'Para o RH: preencha os dados do ex-empregado e dos dependentes. No final você baixa os formulários de exclusão prontos para assinar. Nada do que você digita fica salvo neste site.';
  $('#view').innerHTML = XVIEWS[X.step]();
  navSteps(PASSOS_EXC, X.step);
  $('#voltar').disabled = X.step === 0;
  $('#avancar').hidden = X.step === 2;
  $('#avancar').textContent = X.step === 1 ? 'Revisar e gerar' : 'Continuar';
  $('#pos').textContent = `Etapa ${X.step + 1} de 3`;
  salvar();
}
function validarX(step) {
  const e = [], bad = [];
  const req = (o, path, k, nome) => { if (!String(o[k] ?? '').trim()) { e.push(nome); bad.push(`${path}.${k}`); } };
  const valorOk = v => parseFloat(String(v || '').replace(/\./g, '').replace(',', '.')) > 0;
  if (step === 0) {
    const t = X.titular;
    req(t, 'xt', 'nome', 'Nome do ex-empregado');
    if (!cpfOk(t.cpf)) { e.push('CPF do ex-empregado inválido'); bad.push('xt.cpf'); }
    if (String(t.codigo || '').replace(/\D/g, '').length !== 17) { e.push('Código do beneficiário do titular: 17 números, como 0090.2195.000002-00-0'); bad.push('xt.codigo'); }
    if (!valorOk(t.valor)) { e.push('Valor da mensalidade do titular'); bad.push('xt.valor'); }
    req(X, 'x', 'dataDemissao', 'Data da demissão');
    if (!X.motivo) { e.push('Motivo da exclusão'); bad.push('r-motivo'); }
    if (X.motivo === 'f') req(X, 'x', 'motivoOutro', 'Descreva o motivo');
    if (!X.contribuiu) { e.push('Informe se o funcionário contribuía'); bad.push('r-contribuiu'); }
    if (X.contribuiu === 'sim') {
      req(X, 'x', 'admissao', 'Data de admissão');
      if (X.admissao && X.dataDemissao && !MX.periodo(X.admissao, X.dataDemissao)) { e.push('A admissão precisa ser antes da demissão'); bad.push('x.admissao'); }
    }
    if (!X.opcao) { e.push('Informe se o ex-empregado optou por manter o plano'); bad.push('r-opcao'); }
  }
  if (step === 1) X.deps.forEach((d, i) => {
    const q = `Dependente ${i + 1}`;
    req(d, 'xd' + i, 'nome', `${q}: nome`);
    if (d.cpf && !cpfOk(d.cpf)) { e.push(`${q}: CPF inválido`); bad.push(`xd${i}.cpf`); }
    if (String(d.codigo || '').replace(/\D/g, '').length !== 17) { e.push(`${q}: código do beneficiário com 17 números`); bad.push(`xd${i}.codigo`); }
    if (!PARENT.includes(d.parentesco)) { e.push(`${q}: parentesco`); bad.push(`xd${i}.parentesco`); }
    if (!valorOk(d.valor)) { e.push(`${q}: valor da mensalidade`); bad.push(`xd${i}.valor`); }
  });
  return { e, bad };
}
function irParaX(s) {
  if (s > X.step) { for (let k = X.step; k < s; k++) { const r = validarX(k); if (!r.e.length) continue; if (k !== X.step) { X.step = k; renderX(); } mostraErros(r); return; } }
  $('#errs').hidden = true; X.step = s; renderX(); window.scrollTo({ top: 0 });
}
document.addEventListener('change', e => {
  const r = e.target.dataset && e.target.dataset.xr;
  if (!r) return;
  X[r] = e.target.value; cacheX = null;
  const y = window.scrollY; renderX(); window.scrollTo({ top: y });
});
document.addEventListener('input', e => {
  cacheX = null;
  if (MODO === 'exclusao' && ['x.admissao', 'x.dataDemissao'].includes(e.target.id) && X.step === 0 && X.contribuiu === 'sim') {
    const c = document.querySelector('.calc'); const t = xPeriodoTxt();
    if (c && t) c.innerHTML = `Período de contribuição (admissão até demissão): <b>${t}</b>`;
    else if (!c && t) { const y = window.scrollY; renderX(); window.scrollTo({ top: y }); }
  }
});
document.addEventListener('click', e => {
  if (e.target.id === 'xadddep') { X.deps.push({ nome: '', cpf: '', codigo: '', parentesco: '', valor: '' }); cacheX = null; renderX(); return; }
  if (e.target.dataset && e.target.dataset.xrm !== undefined) { X.deps.splice(+e.target.dataset.xrm, 1); cacheX = null; renderX(); return; }
  const dl = e.target.closest('[data-xdl]'); if (dl) baixarX(dl.dataset.xdl, dl);
});
let cacheX = null, arqsX = null;
async function gerarX() {
  if (cacheX) return cacheX;
  if (!arqsX) {
    const get = async n => { const r = await fetch(n); if (!r.ok) throw new Error('Não consegui carregar ' + n); return new Uint8Array(await r.arrayBuffer()); };
    const nomes = ['exclusao/1_solicitacao.pdf', 'exclusao/2_comunicado_empresa.pdf', 'exclusao/3_opcao_manutencao.pdf', 'exclusao/4_movimentacao.pdf', 'exclusao/5_extincao_vinculo.pdf', 'carimbo_empresa.png'];
    const [solicitacao, comunicadoEmpresa, opcaoManutencao, movimentacao, extincao, carimbo] = await Promise.all(nomes.map(get));
    arqsX = { solicitacao, comunicadoEmpresa, opcaoManutencao, movimentacao, extincao, carimbo };
  }
  const dados = { ...X, contribuiu: X.contribuiu === 'sim' ? true : X.contribuiu === 'nao' ? false : null, dependentes: X.deps };
  const r = await MX.gerar(dados, arqsX, PDFLib);
  const tudo = await PDFLib.PDFDocument.create();
  for (const [k] of XDOCS) { const b = r.arquivos[k]; if (!b) continue; const d = await PDFLib.PDFDocument.load(b); (await tudo.copyPages(d, d.getPageIndices())).forEach(p => tudo.addPage(p)); }
  r.arquivos.tudo = await tudo.save();
  return cacheX = r;
}
const XNOMES = { tudo: 'Exclusao Unimed', solicitacao: '1 Solicitacao de exclusao', comunicadoEmpresa: '2 Comunicado da empresa', opcaoManutencao: '3 Opcao de manutencao', movimentacao: '4 Movimentacao Cadastral', extincao: '5 Extincao do vinculo' };
async function baixarX(tipo, btn) {
  const msg = $('#dlmsg'); btn.disabled = true; msg.textContent = 'Preparando o PDF…';
  try {
    const r = await gerarX();
    const nome = `${XNOMES[tipo]} - ${MX.nomeProprio(X.titular.nome)}.pdf`;
    const url = URL.createObjectURL(new Blob([r.arquivos[tipo]], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    msg.textContent = `Baixado: ${nome}`;
  } catch (err) { msg.textContent = (err && err.message) || 'Não foi possível gerar o arquivo.'; }
  finally { btn.disabled = false; }
}

render();
</script>
