<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ficha de Inclusão Cucinare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: formulário em etapas, coluna única de 720px, barra de etapas no topo e navegação fixa no rodapé */
:root{
  --paper:#f6f7f4; --card:#ffffff; --ink:#18202b; --muted:#5b6573; --line:#d9ddd6;
  --pen:#1d3f94; --pen-soft:#e7ecf8; --sim:#b4321f; --sim-soft:#fbe9e5; --ok:#2f7a4b; --ok-soft:#e5f2ea;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161c; --card:#1a2028; --ink:#e7eaee; --muted:#9aa4b1; --line:#2c3440;
  --pen:#8fb0ff; --pen-soft:#1f2b45; --sim:#ff8c75; --sim-soft:#3a201b; --ok:#7fd3a0; --ok-soft:#18301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161c; --card:#1a2028; --ink:#e7eaee; --muted:#9aa4b1; --line:#2c3440;
  --pen:#8fb0ff; --pen-soft:#1f2b45; --sim:#ff8c75; --sim-soft:#3a201b; --ok:#7fd3a0; --ok-soft:#18301f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;line-height:1.15}
h2{font-size:1.25rem}
h3{font-size:1rem;font-family:var(--body);font-weight:700;letter-spacing:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.lead{color:var(--muted);margin:.4rem 0 0;max-width:60ch}
header.top{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:6px;padding-block:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.steps button{flex:1;min-width:0;border:0;background:none;font:600 .78rem var(--body);color:var(--muted);padding:6px 4px;border-bottom:3px solid var(--line);cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button[aria-current="step"]{color:var(--pen);border-color:var(--pen)}
.steps button.done{color:var(--ok);border-color:var(--ok)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 6;min-width:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
@media (max-width:560px){.s2,.s3,.s4{grid-column:span 6}.s2.half,.s3.half{grid-column:span 3}}
label{font-size:.8rem;font-weight:600;color:var(--ink)}
label .req{color:var(--sim)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
.bad{border-color:var(--sim)!important;background:var(--sim-soft)}
.hint{font-size:.75rem;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{font:600 .92rem var(--body);border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--card)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
.errs{border:1px solid var(--sim);background:var(--sim-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.88rem}
.errs ul{margin:.3rem 0 0;padding-left:1.1rem}
.dephead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--pen);background:var(--pen-soft);border-radius:4px;padding:2px 7px}
/* questionário */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--muted)}
.qgroup{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.qgroup>h3{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.qgroup>h3 .n{font-family:var(--mono);color:var(--pen);font-size:.85rem;min-width:1.6em}
.q{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.q:last-child{border-bottom:0}
.q .lbl{display:flex;gap:10px;font-size:.92rem}
.q .lbl .sub{font-family:var(--mono);color:var(--muted);min-width:1.6em;font-size:.82rem;padding-top:1px}
.answers{display:flex;flex-wrap:wrap;gap:6px;padding-left:2.2em}
.ans{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 6px 4px 11px;font:500 .8rem var(--body);cursor:pointer}
.ans b{font-family:var(--mono);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:.8rem}
.ans[aria-pressed="true"]{border-color:var(--sim);background:var(--sim-soft)}
.ans[aria-pressed="true"] b{background:var(--sim);color:var(--card);border-color:var(--sim)}
.spec{margin-left:2.2em;border-left:3px solid var(--sim);padding:8px 0 8px 12px;display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px}
@media (max-width:560px){.spec{grid-template-columns:minmax(0,1fr)}.answers,.spec{padding-left:0;margin-left:0}}
.spec .who{grid-column:1/-1;font-size:.78rem;font-weight:700;color:var(--sim);text-transform:uppercase;letter-spacing:.05em}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:auto;margin-top:4px}
/* revisão */
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-size:.9rem}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-weight:600}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.file span{min-width:0;overflow-wrap:anywhere;font-size:.9rem}
.steps-list{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}
.note{font-size:.82rem;color:var(--muted)}
.okbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:8px;padding:10px 14px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.ans,.btn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <span class="eyebrow">Cucinare Pro Alimentação · Plano Unimed Lorena</span>
    <h1>Ficha de inclusão no plano de saúde</h1>
    <p class="lead">Preencha seus dados, os dos seus dependentes e a declaração de saúde. No final você baixa os formulários prontos para imprimir e assinar. Nada do que você digita fica salvo neste site.</p>
  </header>

  <nav class="steps" id="steps" aria-label="Etapas">
    <button type="button" data-s="0">1 · Seus dados</button>
    <button type="button" data-s="1">2 · Dependentes</button>
    <button type="button" data-s="2">3 · Saúde</button>
    <button type="button" data-s="3">4 · Gerar</button>
  </nav>

  <div id="errs" class="errs" hidden></div>
  <main id="view"></main>
</div>

<div class="navbar"><div class="in">
  <button type="button" class="btn ghost" id="voltar">Voltar</button>
  <span class="note" id="pos"></span>
  <button type="button" class="btn primary" id="avancar">Continuar</button>
</div></div>

    c3.txt(0, T.estadoCivil, X1, 340, S, { maxW: 168 }); c3.txt(0, T.sexo, X2, 340, S, { maxW: 168 }); c3.txt(0, fmtData(T.nascimento), X3, 340, S, { maxW: 165 });
    c3.txt(0, nomeProprio(T.nomeMae), X1, 360.5, S, { maxW: 345 }); c3.txt(0, fmtData(T.admissao), X3, 360.5, S, { maxW: 165 });
    c3.txt(0, T.profissao, X1, 390.5, S, { maxW: 170 });
    // quadros de dependentes: [página, topo "DEP.", cpf, estado civil, mãe, parentesco]
    const blocos = [[0, 555.6, 585.2, 609.2, 633.2, 653.2], [1, 68.7, 98.4, 128.0, 157.7, 187.4], [1, 335.3, 365.0, 384.9, 414.5, 454.0], [2, 335.3, 365.0, 384.9, 414.5, 454.0]];
    const D1 = 55, D2 = 243.5, D3 = 411;
    deps.slice(0, 4).forEach((d, i) => {
      const [pi, t, cpf, ec, mae, par] = blocos[i]; const oc = i >= 2 ? 12.6 : 14.5;
      if (i === 2) { c3.branco(pi, 59.5, 344.5, 67.6, 353.6); c3.txt(pi, '3', 63.55, 352.4, 8, { center: true, bold: true, cor: rgb(0, 0, 0) }); }
      c3.txt(pi, nomeProprio(d.nome), 86, t + 21.5, 10, { maxW: 485 });
      c3.txt(pi, fmtCPF(d.cpf), D1, cpf + oc, S, { maxW: 182 }); c3.txt(pi, d.rg, D2, cpf + oc, S, { maxW: 162 }); c3.txt(pi, fmtCNS(d.cns), D3, cpf + oc, S, { maxW: 163 });
      c3.txt(pi, d.estadoCivil, D1, ec + 14.5, S, { maxW: 182 }); c3.txt(pi, d.sexo, D2, ec + 14.5, S, { maxW: 162 }); c3.txt(pi, fmtData(d.nascimento), D3, ec + 14.5, S, { maxW: 163 });
      c3.txt(pi, nomeProprio(d.nomeMae), D1, mae + 13.5, S, { maxW: 348 }); c3.txt(pi, d.nacionalidade, D3, mae + 13.5, S, { maxW: 163 });
      c3.txt(pi, d.parentesco, D1, par + 13.5, S, { maxW: 348 });
    });
    // data por extenso + carimbo/assinatura da empresa (pág 2 e, se houver, cópia)
    for (let pi = 1; pi < mv.getPageCount(); pi++) {
      c3.txt(pi, String(+dp.d), 421, 634.2, 10, { center: true });
      c3.txt(pi, MESES[+dp.m - 1], 480.6, 634.2, 10, { center: true });

    const mov = await mv.save();

    return { saude, glc, mov, sobra };
  }

  const API = { gerarTodos, nomeProprio, fmtCPF, fmtData, idade, partes, FIXO };

<script>
const D = DADOS_UNIMED, M = MotorUnimed;
const ECIVIL = ['Solteiro(a)','Casado(a)','União estável','Divorciado(a)','Separado(a)','Viúvo(a)'];
const PARENT = ['Cônjuge','Companheiro(a)','Filho(a)','Enteado(a)','Menor sob guarda','Pai','Mãe'];
const hoje = (()=>{const d=new Date();const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`})();

const vazioPessoa = () => ({nome:'',cpf:'',rg:'',cns:'',nascimento:'',sexo:'',estadoCivil:'',nomeMae:'',nacionalidade:'Brasileira',peso:'',altura:''});
let S = {step:0, data:hoje,
  titular:{...vazioPessoa(), email:'',telefone:'',endereco:'',numero:'',complemento:'',bairro:'',cidade:'',cep:'',admissao:'',profissao:''},
  deps:[], resp:{}, esp:{}, leu:false};
try{const s=sessionStorage.getItem('ficha-unimed'); if(s) S={...S,...JSON.parse(s)}; }catch(e){}
function salvar(){try{sessionStorage.setItem('ficha-unimed',JSON.stringify(S))}catch(e){}}

function nprop(){return 1+S.deps.length}
function ajustaResp(){
  for(const q of D.perguntas){
    const a=S.resp[q.id]||[]; const n=nprop();
    while(a.length<n) a.push('N'); a.length=n; S.resp[q.id]=a;
  }
  for(const k of Object.keys(S.esp)){const p=+k.split('|')[1]; if(p>=nprop()||S.resp[k.split('|')[0]][p]!=='S') delete S.esp[k];}
}
ajustaResp();

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pnome(i){ if(i===0) return 'Você (titular)'; const n=(S.deps[i-1].nome||'').trim().split(' ')[0]; return n?`${M.nomeProprio(n)} (dep. ${i})`:`Dependente ${i}`; }

/* ---------- campos ---------- */
function campo(obj,path,k,label,o={}){
  const id=`${path}.${k}`, v=obj[k]??'', req=o.req!==false;
  const lab=`<label for="${id}">${label}${req?' <span class="req">*</span>':''}</label>`;
  let ctl;
  if(o.opts) ctl=`<select id="${id}" data-p="${path}" data-k="${k}"><option value="">Selecione</option>${o.opts.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else ctl=`<input id="${id}" data-p="${path}" data-k="${k}" type="${o.type||'text'}" value="${esc(v)}"${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.im?` inputmode="${o.im}"`:''}${o.mask?` data-mask="${o.mask}"`:''}${o.auto?` autocomplete="${o.auto}"`:''}${o.max?` max="${o.max}"`:''}>`;
  return `<div class="f ${o.cls||'s3'}">${lab}${ctl}${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`;
}
function objDe(path){ return path==='t'?S.titular:S.deps[+path.slice(1)]; }

const MASK={
  cpf:v=>{v=v.replace(/\D/g,'').slice(0,11);return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,'$1.$2.$3-$4')},
  cep:v=>{v=v.replace(/\D/g,'').slice(0,8);return v.replace(/(\d{5})(\d)/,'$1-$2')},
  tel:v=>{v=v.replace(/\D/g,'').slice(0,11);if(v.length>10)return v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');return v.replace(/(\d{2})(\d{0,4})(\d{0,4})/,(m,a,b,c)=>`(${a}) ${b}${c?'-'+c:''}`)},
  cns:v=>{v=v.replace(/\D/g,'').slice(0,15);return v.replace(/(\d{3})(\d{0,4})(\d{0,4})(\d{0,4})/,(m,a,b,c,d)=>[a,b,c,d].filter(Boolean).join(' '))},
  mesano:v=>{v=v.replace(/\D/g,'').slice(0,6);return v.length>2?v.slice(0,2)+'/'+v.slice(2):v},
  altura:v=>{v=v.replace(/[^\d,.]/g,'').replace('.',',');const d=v.replace(/\D/g,'');if(/^\d{3}$/.test(d)&&!v.includes(','))return d[0]+','+d.slice(1);return v.slice(0,4)},
  peso:v=>v.replace(/\D/g,'').slice(0,3)
};

function pessoaCampos(o,path,tit){
  let h='<div class="grid">';
  h+=campo(o,path,'nome','Nome completo, sem abreviar',{cls:'s6',auto:tit?'name':'off'});
  h+=campo(o,path,'cpf','CPF',{cls:'s2',im:'numeric',mask:'cpf',ph:'000.000.000-00'});
  h+=campo(o,path,'rg','RG (identidade)',{cls:'s2'});
  h+=campo(o,path,'cns','Cartão Nacional de Saúde (CNS)',{cls:'s2',im:'numeric',mask:'cns',ph:'000 0000 0000 0000',hint:'15 números, no cartão do SUS ou no app Meu SUS Digital'});
  h+=campo(o,path,'nascimento','Data de nascimento',{cls:'s2 half',type:'date',max:hoje});
  h+=campo(o,path,'sexo','Sexo',{cls:'s2 half',opts:['Masculino','Feminino']});
  h+=campo(o,path,'estadoCivil','Estado civil',{cls:'s2',opts:ECIVIL});
  h+=campo(o,path,'nomeMae','Nome completo da mãe',{cls:tit?'s6':'s4'});
  if(!tit) h+=campo(o,path,'nacionalidade','Nacionalidade',{cls:'s2'});
  if(!tit) h+=campo(o,path,'parentesco','Parentesco com você',{cls:'s2',opts:PARENT});
  h+=campo(o,path,'peso','Peso (kg)',{cls:'s2 half',im:'numeric',mask:'peso',ph:'75',hint:'Sem casas decimais'});
  h+=campo(o,path,'altura','Altura (m)',{cls:'s2 half',im:'decimal',mask:'altura',ph:'1,72'});
  return h+'</div>';
}

/* ---------- etapas ---------- */
function vDados(){
  const t=S.titular;
  return `<section class="card"><h2>Seus dados</h2>${pessoaCampos(t,'t',true)}</section>
  <section class="card"><h2>Contato e endereço</h2><div class="grid">
  ${campo(t,'t','email','E-mail',{cls:'s3',type:'email',auto:'email',im:'email'})}
  ${campo(t,'t','telefone','Telefone com DDD',{cls:'s3',type:'tel',mask:'tel',im:'tel',auto:'tel',ph:'(12) 99999-9999'})}
  ${campo(t,'t','cep','CEP',{cls:'s2',im:'numeric',mask:'cep',ph:'00000-000'})}
  ${campo(t,'t','endereco','Rua / avenida',{cls:'s4',auto:'address-line1'})}
  ${campo(t,'t','numero','Número',{cls:'s2 half'})}
  ${campo(t,'t','complemento','Complemento',{cls:'s2 half',req:false})}
  ${campo(t,'t','bairro','Bairro',{cls:'s2'})}
  ${campo(t,'t','cidade','Cidade',{cls:'s3'})}
  ${campo(t,'t','nacionalidade','Nacionalidade',{cls:'s3'})}
  </div></section>
  <section class="card"><h2>Trabalho</h2><div class="grid">
  ${campo(t,'t','admissao','Data de admissão na empresa',{cls:'s3',type:'date',max:hoje})}
  ${campo(t,'t','profissao','Profissão',{cls:'s3'})}
  </div></section>`;
}
function vDeps(){
  let h=`<section class="card"><h2>Dependentes</h2><p class="lead" style="margin:0">Inclua até 4 dependentes. Se você vai entrar sozinho no plano, é só continuar.</p></section>`;
  S.deps.forEach((d,i)=>{
    h+=`<section class="card"><div class="dephead"><span class="tag">Dependente ${i+1}</span><button type="button" class="btn ghost" data-rm="${i}">Remover</button></div>${pessoaCampos(d,'d'+i,false)}</section>`;
  });
  if(S.deps.length<4) h+=`<button type="button" class="btn" id="adddep">+ Adicionar dependente</button>`;
  return h;
}
function vSaude(){
  const n=nprop();
  let h=`<section class="card"><h2>Declaração de saúde</h2>
  <p class="lead" style="margin:0">Todas as respostas começam como <b>N</b> (não). Leia cada pergunta e toque no nome da pessoa para mudar para <b>S</b> (sim). Para cada S, informe o diagnóstico e desde quando.</p>
  <p class="note" style="margin:0">A Unimed exige que todas as doenças ou lesões que você conhece sejam declaradas. Omitir pode levar ao cancelamento do plano.</p>
  </section>`;
  let gAtual=null;
  for(const q of D.perguntas){
    if(q.grupo!==gAtual){
      if(gAtual!==null) h+='</div>';
      gAtual=q.grupo;
      const single=!q.sub;
      h+=`<div class="qgroup"><h3><span class="n">${q.item}</span><span>${esc(single&&q.grupo>=16?'Pergunta '+q.item:D.grupos[q.grupo])}</span></h3>`;
    }
    const r=S.resp[q.id];
    h+=`<div class="q"><div class="lbl"><span class="sub">${q.sub?q.sub.toLowerCase():''}</span><span>${esc(q.texto)}</span></div><div class="answers">`;
    for(let i=0;i<n;i++) h+=`<button type="button" class="ans" data-q="${q.id}" data-i="${i}" aria-pressed="${r[i]==='S'}">${esc(pnome(i))}<b>${r[i]}</b></button>`;
    h+='</div>';
    for(let i=0;i<n;i++) if(r[i]==='S'){
      const k=`${q.id}|${i}`, e=S.esp[k]||{texto:'',periodo:''};
      h+=`<div class="spec"><span class="who">${esc(pnome(i))} · item ${q.item}${q.sub?' '+q.sub:''}</span>
      <div class="f"><label for="e-${k}">${esc(q.dica||'Informe o diagnóstico (nome da doença) e se está em tratamento')} <span class="req">*</span></label><textarea id="e-${k}" data-esp="${k}" data-f="texto" maxlength="160" rows="2">${esc(e.texto)}</textarea></div>
      <div class="f"><label for="p-${k}">Diagnóstico (mês/ano) <span class="req">*</span></label><input id="p-${k}" data-esp="${k}" data-f="periodo" data-mask="mesano" inputmode="numeric" placeholder="03/2017" value="${esc(e.periodo)}"></div></div>`;
    }
    h+='</div>';
  }
  h+='</div>';
  h+=`<section class="card"><label class="check"><input type="checkbox" id="leu"${S.leu?' checked':''}> <span>Li todas as perguntas acima, para mim e para cada dependente, e as respostas estão corretas.</span></label></section>`;
  return h;
}
function vGerar(){
  const nS=Object.values(S.resp).flat().filter(x=>x==='S').length;
  return `<section class="card"><h2>Conferência</h2>
  <dl class="sum">
    <dt>Titular</dt><dd>${esc(M.nomeProprio(S.titular.nome))}</dd>
    <dt>Dependentes</dt><dd class="num">${S.deps.length}</dd>
    <dt>Respostas S na declaração</dt><dd class="num">${nS}</dd>
    <dt>Data dos formulários</dt><dd class="num">${M.fmtData(S.data)}</dd>
  </dl></section>
  <section class="card"><h2>Baixar os formulários</h2>
  <p class="note" style="margin:0">O arquivo completo já traz os três formulários na ordem certa. No celular, o PDF pode abrir numa nova tela: use o botão de compartilhar ou salvar para guardar.</p>
  <div class="files">
    <div class="file"><span><b>Todos os formulários</b> · um PDF só</span><button type="button" class="btn primary" data-dl="tudo">Baixar</button></div>
    <div class="file"><span>Declaração de Saúde (11 páginas)</span><button type="button" class="btn" data-dl="saude">Baixar</button></div>
    <div class="file"><span>Declaração Manual MPS / GLC</span><button type="button" class="btn" data-dl="glc">Baixar</button></div>
    <div class="file"><span>Movimentação Cadastral</span><button type="button" class="btn" data-dl="mov">Baixar</button></div>
  </div>
  <div id="dlmsg" class="note" role="status"></div>
  </section>
  <section class="card"><h2>Depois de baixar</h2>
  <ol class="steps-list">
    <li>Imprima todos os formulários.</li>
    <li>Na <b>Declaração de Saúde</b>: rubrique a pág. 1 e assine em todas as outras páginas, no campo do titular.</li>
    <li>Assine a <b>Declaração MPS/GLC</b> e a <b>Movimentação Cadastral</b> (campo "Beneficiário Titular").</li>
    <li>Digitalize mantendo a ordem das páginas e entregue ao RH junto com os documentos pedidos.</li>
  </ol>
  <button type="button" class="btn ghost" id="limpar">Apagar meus dados desta tela</button>
  </section>`;
}
const VIEWS=[vDados,vDeps,vSaude,vGerar];

/* ---------- validação ---------- */
function cpfOk(c){c=(c||'').replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;
  for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if(((s*10)%11)%10!==+c[t])return false}return true}
function validar(step){
  const e=[], bad=[];
  const req=(o,path,k,nome)=>{ if(!String(o[k]??'').trim()){e.push(nome);bad.push(`${path}.${k}`)} };
  const pessoa=(o,path,quem,tit)=>{
    req(o,path,'nome',`${quem}: nome`);
    if(!cpfOk(o.cpf)){e.push(`${quem}: CPF inválido`);bad.push(`${path}.cpf`)}
    req(o,path,'rg',`${quem}: RG`);
    if((o.cns||'').replace(/\D/g,'').length!==15){e.push(`${quem}: Cartão Nacional de Saúde precisa ter 15 números`);bad.push(`${path}.cns`)}
    req(o,path,'nascimento',`${quem}: data de nascimento`);
    req(o,path,'sexo',`${quem}: sexo`);req(o,path,'estadoCivil',`${quem}: estado civil`);
    req(o,path,'nomeMae',`${quem}: nome da mãe`);req(o,path,'nacionalidade',`${quem}: nacionalidade`);
    if(!tit) req(o,path,'parentesco',`${quem}: parentesco`);
    const p=+o.peso; if(!(p>=1&&p<=300)){e.push(`${quem}: peso em kg`);bad.push(`${path}.peso`)}
    const a=parseFloat(String(o.altura).replace(',','.')); if(!(a>=0.3&&a<=2.3)){e.push(`${quem}: altura no formato 1,72`);bad.push(`${path}.altura`)}
  };
  if(step===0){
    const t=S.titular; pessoa(t,'t','Você',true);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((t.email||'').trim())){e.push('E-mail válido');bad.push('t.email')}
    const tl=(t.telefone||'').replace(/\D/g,''); if(tl.length<10){e.push('Telefone com DDD');bad.push('t.telefone')}
    if((t.cep||'').replace(/\D/g,'').length!==8){e.push('CEP com 8 números');bad.push('t.cep')}
    for(const [k,n] of [['endereco','Endereço'],['numero','Número'],['bairro','Bairro'],['cidade','Cidade'],['admissao','Data de admissão'],['profissao','Profissão']]) req(t,'t',k,n);
  }
  if(step===1) S.deps.forEach((d,i)=>pessoa(d,'d'+i,`Dependente ${i+1}`,false));
  if(step===2){
    for(const q of D.perguntas) S.resp[q.id].forEach((r,i)=>{ if(r==='S'){const k=`${q.id}|${i}`,x=S.esp[k]||{};
      if(!(x.texto||'').trim()){e.push(`Item ${q.item}${q.sub} (${pnome(i)}): informe o diagnóstico`);bad.push('e-'+k)}
      if(!/^(0[1-9]|1[0-2])\/(19|20)\d\d$/.test(x.periodo||'')){e.push(`Item ${q.item}${q.sub} (${pnome(i)}): mês/ano do diagnóstico, ex. 03/2017`);bad.push('p-'+k)} }});
    if(!S.leu){e.push('Confirme que leu todas as perguntas');bad.push('leu')}
  }
  return {e,bad};
}
function mostraErros(r){
  const box=$('#errs');
  document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
  if(!r.e.length){box.hidden=true;return true}
  box.innerHTML=`<b>Falta corrigir antes de continuar:</b><ul>${r.e.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${r.e.length>12?`<span>e mais ${r.e.length-12}.</span>`:''}`;
  box.hidden=false;
  r.bad.forEach(id=>{const el=document.getElementById(id); if(el) el.classList.add('bad')});
  window.scrollTo({top:0,behavior:'smooth'});
  return false;
}

/* ---------- render e eventos ---------- */
function render(){
  $('#view').innerHTML=VIEWS[S.step]();
  document.querySelectorAll('#steps button').forEach(b=>{const s=+b.dataset.s;
    b.toggleAttribute('aria-current',false); if(s===S.step) b.setAttribute('aria-current','step');
    b.classList.toggle('done',s<S.step)});
  $('#voltar').disabled=S.step===0;
  $('#avancar').hidden=S.step===3;
  $('#avancar').textContent=S.step===2?'Revisar e gerar':'Continuar';
  $('#pos').textContent=`Etapa ${S.step+1} de 4`;
  salvar();
}
function irPara(s){
  if(s>S.step){ for(let k=S.step;k<s;k++){ const r=validar(k); if(!r.e.length) continue; if(k!==S.step){S.step=k;render()} mostraErros(r); return } }
  $('#errs').hidden=true; S.step=s; render(); window.scrollTo({top:0});
}
$('#avancar').onclick=()=>irPara(S.step+1);
$('#voltar').onclick=()=>irPara(S.step-1);
$('#steps').onclick=e=>{const b=e.target.closest('button'); if(b) irPara(+b.dataset.s)};

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.mask){const f=MASK[el.dataset.mask]; const v=f(el.value); if(v!==el.value) el.value=v;}
  if(el.dataset.p){objDe(el.dataset.p)[el.dataset.k]=el.value; el.classList.remove('bad'); salvar()}
  if(el.dataset.esp){const k=el.dataset.esp; S.esp[k]=S.esp[k]||{texto:'',periodo:''}; S.esp[k][el.dataset.f]=el.value; el.classList.remove('bad'); salvar()}
  if(el.id==='leu'){S.leu=el.checked; salvar()}
});
document.addEventListener('change',e=>{ if(e.target.id==='leu'){S.leu=e.target.checked;salvar()} if(e.target.tagName==='SELECT'&&e.target.dataset.p){objDe(e.target.dataset.p)[e.target.dataset.k]=e.target.value;salvar()} });
document.addEventListener('click',e=>{
  const a=e.target.closest('.ans');
  if(a){const q=a.dataset.q,i=+a.dataset.i; S.resp[q][i]=S.resp[q][i]==='S'?'N':'S';
    if(S.resp[q][i]==='N') delete S.esp[`${q}|${i}`];
    const y=window.scrollY; render(); window.scrollTo({top:y});
    if(S.resp[q][i]==='S'){const t=document.getElementById(`e-${q}|${i}`); if(t) t.focus({preventScroll:true})}
    return}
  if(e.target.id==='adddep'){S.deps.push({...vazioPessoa(),parentesco:''}); ajustaResp(); render(); return}
  if(e.target.dataset.rm!==undefined){S.deps.splice(+e.target.dataset.rm,1); ajustaResp(); render(); return}
  const dl=e.target.closest('[data-dl]'); if(dl){baixar(dl.dataset.dl,dl);return}
  if(e.target.id==='limpar'){try{sessionStorage.removeItem('ficha-unimed')}catch(_){} location.reload()}
});

/* ---------- geração ---------- */
let cache=null, arqs=null;
async function carregaArquivos(){
  if(arqs) return arqs;
  const get=async n=>{const r=await fetch(n); if(!r.ok) throw new Error('Não consegui carregar '+n); return new Uint8Array(await r.arrayBuffer())};
  const [saude,glc,mov,assinatura,carimbo]=await Promise.all(['declaracao_saude.pdf','declaracao_glc.pdf','movimentacao.pdf','assinatura_intermediario.png','carimbo_empresa.png'].map(get));
  return arqs={saude,glc,mov,assinatura,carimbo,dados:D};
}
async function gerar(){
  if(cache) return cache;
  const a=await carregaArquivos();
  const esp=Object.entries(S.esp).map(([k,v])=>({q:k.split('|')[0],prop:+k.split('|')[1],texto:v.texto,periodo:v.periodo}));
  const r=await M.gerarTodos({data:S.data,titular:S.titular,dependentes:S.deps,respostas:S.resp,especificacoes:esp},a,PDFLib);
  if(r.sobra.length) throw new Error('As especificações não cabem no quadro da declaração. Encurte os textos das respostas S e tente de novo.');
  const tudo=await PDFLib.PDFDocument.create();
  for(const b of [r.saude,r.glc,r.mov]){const d=await PDFLib.PDFDocument.load(b); (await tudo.copyPages(d,d.getPageIndices())).forEach(p=>tudo.addPage(p))}
  r.tudo=await tudo.save();
  return cache=r;
}
const NOMES={tudo:'Inclusao Unimed',saude:'Declaracao de Saude',glc:'Declaracao MPS GLC',mov:'Movimentacao Cadastral'};
async function baixar(tipo,btn){
  const msg=$('#dlmsg'); btn.disabled=true; msg.textContent='Preparando o PDF…';
  try{
    const r=await gerar();
    const nome=`${NOMES[tipo]} - ${M.nomeProprio(S.titular.nome)}.pdf`;
    const url=URL.createObjectURL(new Blob([r[tipo]],{type:'application/pdf'}));
    const a=document.createElement('a'); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    msg.textContent=`Baixado: ${nome}`;
  }catch(err){
    msg.textContent=(err&&err.message)||'Não foi possível gerar o arquivo.';
  }finally{btn.disabled=false}
}
// limpa cache se dados mudarem
document.addEventListener('input',()=>{cache=null},true);
document.addEventListener('click',e=>{if(e.target.closest('.ans,[data-rm],#adddep'))cache=null},true);

render();
</script>
